<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Seminar Registration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>IT Seminar Student Registration</h1>

    <div id="successMessage" class="success-message" role="status"></div>

    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required aria-describedby="fullNameError">
        <span id="fullNameError" class="error-msg" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="studentNumber">Student Number</label>
        <input type="text" id="studentNumber" name="studentNumber" placeholder="24-1234-123" required aria-describedby="studentNumberError">
        <span id="studentNumberError" class="error-msg" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required aria-describedby="emailError">
        <span id="emailError" class="error-msg" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="mobileNumber">Mobile Number</label>
        <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="09123456789 or +639123456789" required aria-describedby="mobileNumberError">
        <span id="mobileNumberError" class="error-msg" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required aria-describedby="passwordError passwordFeedback">
        <span id="passwordFeedback" class="info-msg" aria-live="polite"></span>
        <span id="passwordError" class="error-msg" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required aria-describedby="confirmPasswordError">
        <span id="confirmPasswordError" class="error-msg" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="course">Course</label>
        <select id="course" name="course" required aria-describedby="courseError">
          <option value="" disabled selected>Select your course</option>
          <option value="BSIT">BSIT</option>
          <option value="BSCS">BSCS</option>
        </select>
        <span id="courseError" class="error-msg" aria-live="polite"></span>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="terms" name="terms" required aria-describedby="termsError">
        <label for="terms">I agree to the terms and conditions</label>
        <span id="termsError" class="error-msg" aria-live="polite"></span>
      </div>

      <div class="form-actions">
        <button type="submit" id="registerBtn">Register</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>
    </form>

    <div id="registrationSummary" class="summary-card" hidden>
      <h2>Registration Summary</h2>
      <p><strong>Full Name:</strong> <span id="summaryName"></span></p>
      <p><strong>Student Number:</strong> <span id="summaryStudentNumber"></span></p>
      <p><strong>Email:</strong> <span id="summaryEmail"></span></p>
      <p><strong>Mobile Number:</strong> <span id="summaryMobileNumber"></span></p>
      <p><strong>Course:</strong> <span id="summaryCourse"></span></p>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
